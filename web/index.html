<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samurai — Viết lại 100% bằng Engine</title>
  <link rel="stylesheet" href="./bundle.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗡</text></svg>">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="hud"></div>
  <div id="help">WASD di chuyển &nbsp;|&nbsp; Chuột xoay camera &nbsp;|&nbsp; Click chuột / J: chém &nbsp;|&nbsp; Space: nhảy &nbsp;|&nbsp; Shift: chạy &nbsp;|&nbsp; V: lăn &nbsp;|&nbsp; X: tra / rút kiếm &nbsp;|&nbsp; Đứng yên 3s: tự tra kiếm</div>
  <div id="start"><div class="box">
    <h2>Samurai — Bản viết lại bằng Engine</h2>
    <p>Map, nhân vật, quái, vật phẩm đều được dựng lại từ đầu bằng @aetheria/engine. Bấm bắt đầu để chơi.</p>
    <button id="start-btn">Bắt đầu</button>
    <p id="boot-error" style="display:none"></p>
  </div></div>
  <script>window.__errors = []; window.addEventListener('error', (e) => window.__errors.push(String(e.message || e)));</script>
  <script src="./bundle.js"></script>
</body>
</html>
